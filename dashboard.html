<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Carry · 打开看板</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, sans-serif; color: #223; background: #f4f7fb; }
      a { color: #315fce; }
    </style>
  </head>
  <body>
    <p>正在识别并打开这份 Agent Carry；如果没有自动跳转，请<a id="dashboard-entry" href="dashboard/dist/index.html">点击这里</a>。</p>
    <script src="dashboard/dist/snapshot.js"></script>
    <script>
      (() => {
        const current = new URL(window.location.href);
        const target = new URL("dashboard/dist/index.html", current);
        current.searchParams.forEach((value, key) => target.searchParams.append(key, value));

        const snapshot = window.AGENT_CARRY_SNAPSHOT;
        const demoMode = window.AGENT_CARRY_DEMO === true;
        const state = snapshot?.overview?.state ?? snapshot?.meta?.state;
        const kind = demoMode ? "demo" : state === "instance" ? "instance" : state === "template" ? "template" : "unavailable";
        const fallbackRef = kind === "demo" ? "public-demo" : kind === "template" ? "template" : kind === "unavailable" ? "unavailable" : "legacy-instance";
        const candidateRef = String(snapshot?.meta?.identity_ref ?? "").trim().toLowerCase();
        const identityRef = /^(?:template|public-demo|unavailable|legacy-instance|ac-[a-f0-9]{12,64})$/.test(candidateRef) ? candidateRef : fallbackRef;
        const candidateVersion = String(snapshot?.meta?.product_version ?? "").trim();
        const version = /^(?:\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?|unknown)$/.test(candidateVersion) ? candidateVersion : "unknown";
        const hasIncomingCapsule = ["ac_kind", "ac_ref", "ac_version"].some((key) => current.searchParams.has(key));

        if (!hasIncomingCapsule) {
          target.searchParams.set("ac_kind", kind);
          target.searchParams.set("ac_ref", identityRef);
          target.searchParams.set("ac_version", version);
        }
        target.hash = current.hash || "#home";

        const entry = document.getElementById("dashboard-entry");
        if (entry) entry.href = target.href;
        window.location.replace(target.href);
      })();
    </script>
    <noscript><p>浏览器需要启用本地 JavaScript 才能打开完整看板。</p></noscript>
  </body>
</html>
