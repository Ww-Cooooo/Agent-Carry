schema_version = 1
policy = "one-formal-owner-per-component"

[[layers]]
id = "template-core"
owns = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "THIRD_PARTY_NOTICES.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "core/**", "docs/**"]
upgrade_policy = "replace-or-migrate-by-release-manifest"
instance_may_modify = false

[[layers]]
id = "instance-identity"
owns = ["instance/manifest.toml", "instance/maps/domain-map.toml", "instance/profile/**"]
excludes = ["instance/profile/README.md"]
upgrade_policy = "preserve-and-schema-migrate"
instance_may_modify = true

[[layers]]
id = "instance-directory-guides"
owns = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md"]
upgrade_policy = "replace-exact-guides-from-target-template-before-restoring-user-assets"
instance_may_modify = false
live_reference_precondition = "if-an-instance-manifest-or-map-references-an-exact-guide-as-user-content-copy-and-hash-verify-that-content-to-a-user-owned-path-update-the-reference-and-only-then-replace-the-guide"
legacy_profile_destination = "instance/profile/approved-profile.md"
reference_collision_policy = "reuse-only-when-byte-identical-otherwise-stop-and-show-conflict"

[[layers]]
id = "instance-assets"
owns = ["instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**"]
excludes = ["instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/signals/README.md", "instance/hosts/README.md"]
upgrade_policy = "preserve"
instance_may_modify = true

[[layers]]
id = "instance-governance"
owns = ["instance/governance/**"]
excludes = ["instance/governance/README.md"]
upgrade_policy = "merge-template-body-preserve-instance-schedule-by-stable-id"
instance_may_modify = true

[[layers]]
id = "instance-professional-extensions"
owns = ["workspace/**"]
upgrade_policy = "preserve-registered-extension-by-manifest; unregistered-workspace-stops-for-conflict-preview"
instance_may_modify = true
manifest_pattern = "workspace/*/extension.toml"
ordinary_startup = "never-enumerate"
complete_migration = "include-only-manifest-portable-paths; private-collection-refs-use-private-parts; device-local-root-excluded"

[[layers]]
id = "instance-derived"
owns = ["instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml"]
upgrade_policy = "rebuild-from-instance-assets"
instance_may_modify = true

[[layers]]
id = "local-private"
owns = [".assistant-private/**", ".assistant-local/**", "maintainer-private/**"]
upgrade_policy = "never-publish-never-overwrite-by-template-preserve-private-catalog-bindings-and-bodies"
instance_may_modify = true

[[layers]]
id = "derived-ui"
owns = ["dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**"]
excludes = ["dashboard/public/snapshot.js", "dashboard/dist/snapshot.js"]
upgrade_policy = "replace-ui"
instance_may_modify = "extension-points-only"

[[layers]]
id = "dashboard-snapshot"
owns = ["dashboard/public/snapshot.js", "dashboard/dist/snapshot.js"]
upgrade_policy = "target-template-snapshot-may-be-intermediate-only; final-instance-snapshot-rebuilds-from-merged-instance-truth-and-both-copies-match"
instance_may_modify = true

[conflict]
default = "stop-and-explain"
options = ["keep-current-instance", "migrate-assets-into-fresh-instance"]
never_silently_overwrite_instance_assets = true
