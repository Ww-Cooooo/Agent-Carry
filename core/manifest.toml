signal_control = "instance/signals/control.toml"
signal_projection = "instance/maps/signal-map.toml"
time_trigger_projection = "instance/maps/time-trigger-map.toml"
trigger_registry = "core/maps/trigger-registry.toml"
host_registry = "instance/hosts/registry.toml"

[contracts]
context_routing = "core/protocols/CONTEXT_ROUTING.md"
result_validation = "core/protocols/RESULT_VALIDATION.md"
asset_lifecycle = "core/protocols/ASSET_LIFECYCLE.md"
external_safety = "core/protocols/EXTERNAL_CONTENT_SAFETY_BOUNDARY.md"
deep_security = "core/protocols/NETWORK_AGENT_SECURITY.md"
