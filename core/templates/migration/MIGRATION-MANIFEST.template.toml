schema_version = 2
record_type = "ai-carry-complete-migration"
kit_id = "{{KIT_ID}}"
created_at = "{{CREATED_AT}}"
source_instance_id = "{{SOURCE_INSTANCE_ID}}"
product_version = "{{PRODUCT_VERSION}}"
asset_schema = "{{ASSET_SCHEMA}}"
private_asset_catalog_schema = 1
github_private_backup = false
credentials_included = false
included_categories = [
  "template-core",
  "instance-identity-and-locked-direction",
  "git-safe-portable-assets",
  "registered-instance-components-portable-content",
  "stable-maps-and-offline-dashboard",
  "all-registered-and-referenced-private-assets-in-separate-parts",
]
excluded_categories = [
  "secret-credentials-and-login-state",
  "unregistered-external-computer-content",
  "git-history-and-private-remotes",
  "assistant-local-and-maintainer-private-material",
  "host-native-hidden-memory-and-system-prompts",
  "cache-log-report-rollback-and-temporary-acceptance-material",
  "build-dependencies-and-unrelated-tools",
]

[body_package]
file = "{{BODY_PACKAGE_FILE}}"
sha256 = "{{BODY_PACKAGE_SHA256}}"
archive_root = "body-package/AI Carry"
manifest_path = "body-package/manifest.json"
file_count = 0 # 生成时替换为 {{BODY_FILE_COUNT}} 整数
uncompressed_bytes = 0 # 生成时替换为 {{BODY_UNCOMPRESSED_BYTES}} 整数
private_content_included = false
credentials_included = false

[private_package]
schema_version = 2
part_count = 0 # 生成时替换为 {{PRIVATE_PART_COUNT}} 整数
entry_count = 0 # 生成时替换为 {{PRIVATE_ENTRY_COUNT}} 整数
uncompressed_bytes = 0 # 生成时替换为 {{PRIVATE_UNCOMPRESSED_BYTES}} 整数
catalog_revision = 0 # 生成时替换为 {{PRIVATE_CATALOG_REVISION}} 整数
catalog_sha256 = "{{PRIVATE_CATALOG_SHA256}}"
coverage_status = "complete"
coverage_started_at = "{{PRIVATE_COVERAGE_STARTED_AT}}"
coverage_checked_at = "{{PRIVATE_COVERAGE_CHECKED_AT}}"
coverage_snapshot_sha256 = "{{PRIVATE_COVERAGE_SNAPSHOT_SHA256}}"
part_target_bytes = 0 # 生成时替换为 {{PRIVATE_PART_TARGET_BYTES}} 整数
credentials_included = false

