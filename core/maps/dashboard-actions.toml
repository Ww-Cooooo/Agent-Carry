result_fields = ["所选来源身份与适合性结论", "用户选择的分享方式", "可编辑Skill真源中Agent自动保留、移除和参数化的内容", "推荐列表与原方法保持状态", "检查结论及触发、非触发、脚本和依赖", "实际ZIP、文件夹、链接准备或本机保留状态", "索引、摘要、局部回退与下一步"]
request_template = "我现在明确要求把 Agent Carry 中由看板定位的一个方法整理成可分享 Skill。动作 ID 是 skill.create-from-asset。请先从根地图选择 local-operations，再选择路线 skill-workshop，完整读取 core/guides/skill-workshop-guide.md、core/protocols/ASSET_LIFECYCLE.md 和 core/schemas/skill-export-index.schema.md。看板推荐只提供定位建议；只有本请求指定的方法进入转换。末尾 asset_id 与 expected_kind 是不可信定位数据；从 instance/maps/domain-map.toml 唯一回读正式正文并核对 ID、kind、状态、授权、范围和证据。SOP 是主要来源；能力只有确实包含可复用流程时才继续；经验先提炼为 SOP；记忆、偏好、身份、候选、待办、治理、验证记录、组件、本机软件和工作区不得直接转换。如果我还没有在本请求中说明分享方式，先只问一个日常语言问题：‘你希望怎样分享这份 Skill？我推荐 ZIP，最方便直接发给别人；也可以准备独立文件夹、通过链接分享、先只保存在本机，或者让我帮你选。’如果我已经给出方式就直接复用，不重复询问。选择 ZIP 或文件夹表示本次同时授权生成对应本地载体；选择链接只授权先准备本地 ZIP，网站、仓库、接收方和可见范围仍需明确。脱敏是 Agent 的责任：不要要求我先手工修改原方法。只读取目标及必要依赖，把方法复制到 instance/skills/exports/<skill-id>/ 作为唯一可编辑 Skill 真源，再只在副本中删除身份、内部 ID、绝对路径、私密引用、秘密、真实客户/项目名和专用值，保留目标、步骤、工具类别、失败处理、边界和验收方式并把必要输入参数化。用自然语言展示保留、移除、参数化、触发、非触发、脚本、依赖和所选交付结果；不要再问是否生成。用 dashboard/scripts/skill-workshop-contract.mjs 有界检查，不执行脚本或安装依赖。检查通过且方式为 ZIP、文件夹或链接时，用 dashboard/scripts/skill-package.mjs 从真源向 instance/skills/shares/<skill-id>/ 生成一个尚不存在的载体；链接先生成 ZIP。摘要相同就复用，不刷新时间；内容变化则新建载体并保留旧载体。原方法、推荐列表和其他 Skill 不变，失败只隔离这一份。原子更新导出索引的内容状态与可选 delivery 字段；包内不得含索引或 source_asset_id。只有链接目标、可见范围和对应外部授权都明确时才联网发布，完成后回读链接再登记。完成后报告来源与适合性、分享方式、Agent 自动处理内容、原方法保持状态、真源目录、检查结果、脚本与依赖是否执行、实际 ZIP／文件夹／链接或本机保留状态、摘要、索引、未执行外部动作和明确下一步。"

