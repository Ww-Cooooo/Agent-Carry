schema_version = 1
registry_id = "unified-trigger-governance"
purpose = "Inventory every condition-to-action rule without turning the registry or rule bodies into startup context."
ordinary_startup = "never-load"
startup_projection = "instance/maps/signal-map.toml"
maintenance_rule = "Every new or changed trigger must declare a class, checkpoint, formal owner, dynamic state owner, startup policy, route, gate, cleanup rule and failure behavior."

[[classes]]
id = "explicit-event"
summary = "A user request or a semantic event in the current task selects an existing route."
persistent = false
evaluation = "at-current-event"
startup_policy = "never-project"

[[classes]]
id = "action-gate"
summary = "A risky or high-impact action is checked immediately before the consequence."
persistent = false
evaluation = "before-action"
startup_policy = "project-only-if-left-unresolved"

[[classes]]
id = "cross-session-count"
summary = "Independent evidence accumulates across tasks until a domain-owned review threshold is reached."
persistent = true
evaluation = "when-a-matching-event-occurs"
startup_policy = "project-only-near-trigger-or-actionable"

[[classes]]
id = "scheduled-time"
summary = "A durable next-check timestamp becomes eligible at the first active checkpoint on or after that time."
persistent = true
evaluation = "compare-only-with-capsule-next-wakeup-at-startup"
startup_policy = "aggregate-earliest-time-and-count-only"

[[classes]]
id = "metric-health"
summary = "A small metric is updated only when the related operation already occurs."
persistent = true
evaluation = "at-related-write-read-or-failure"
startup_policy = "project-only-after-threshold-or-uncertainty"

[[classes]]
id = "validity-on-use"
summary = "Environment, platform or dependency validity is checked when the capability is actually used or explicitly refreshed."
persistent = false
evaluation = "on-use-or-explicit-refresh"
startup_policy = "project-only-if-a-mismatch-is-discovered-and-unresolved"

[[classes]]
id = "transaction-recovery"
summary = "An interrupted durable update must be recovered before another update overwrites it."
persistent = true
evaluation = "every-startup-control-check"
startup_policy = "control-fields-only"

[[classes]]
id = "consumer-local"
summary = "A derived consumer such as the dashboard owns its own freshness check."
persistent = false
evaluation = "inside-the-consumer"
startup_policy = "never-project"

