schema_version = 2
release = "1.4.5"
core = "1.4.5"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.3"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
private_asset_catalog_schema = "1.0"
migration_kit_schema = "2.0"
extension_manifest_schema = "1.0"
instance_component_schema = "1.0"
result_validation_evidence_schema = "1.0"
startup_capsule_schema = "1.0"
from_versions = ["1.4.4"]
notes = "Published 1.4.5 long-session upgrade continuity patch. After verified files switch, the Agent prefers bounded current-conversation reentry at the next safe boundary: rerun the strict Agent Carry startup entry outside model context, compare product version instance ID and manifest digest, load only the minimum target-version rules, check immutable host conflicts, and automatically validate one non-destructive representative behavior. A version string hash capsule snapshot or ordinary file reread is not adoption evidence. A new run is the last compatibility route only when immutable host rules block in-place adoption. A pending or failed behavior never rolls back a valid instance or stops unrelated capabilities. This fixed release can authorize an instance replacement only when the official v1.4.5 tag, Release object, manifest and extracted tree agree and the user authorizes that exact upgrade; it never authorizes future repository or publication actions."
asset_changes = "Asset Schema remains 1.3. The patch creates, promotes, resets, removes and rewrites no memory, capability, SOP, experience, candidate, validation record, component, Skill, workspace, local binding, private reference or unknown instance field."
dashboard_changes = "Dashboard Snapshot Schema remains 1.1 and Dashboard Action Schema remains 1.0. Only the product version in the blank template snapshots advances; no demo or user asset is added."
extension_changes = "Extension API, Extension Manifest Schema and Instance Component Schema remain unchanged. Existing components, extensions, workspaces, Skills and device-local bindings are preserved byte-for-byte and none is loaded merely to accept the upgrade."

replace = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
replace_instance_guides = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md", "instance/validations/README.md", "instance/components/README.md"]
migrate = ["instance/manifest.toml", "instance/startup-capsule.toml", "instance/components/registry.toml", "instance/maps/domain-map.toml", "instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml", "instance/profile/**", "instance/governance/**", "instance/evolution/index.toml", "instance/validations/index.toml"]
preserve = ["workspace/**", "instance/components/**", "instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", "instance/validations/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[classification]
precedence = ["migration_rules", "replace_instance_guides", "migrate", "preserve", "replace", "remove"]
overlap_policy = "first-matching-classification-wins-after-applicable-migration-rules; every selected path must resolve to exactly one effective action"
guide_overlap_note = "Only the exact README files in replace_instance_guides are target-template guides. Sibling user files, Skill requirements, export indexes and packages, component bodies, validation records and migrated profiles remain instance-owned."
validation_overlap_note = "instance/validations/index.toml is migrated before the broad instance/validations/** preserve rule. A template stays the target template empty index; an instance keeps its identity and every real validation record, and no record may be invented by this patch."
evolution_overlap_note = "instance/evolution/index.toml is migrated before the broad instance/evolution/** preserve rule. A template stays blank; an instance keeps candidate sources and its existing generated_at unless the indexed business projection actually changes."
component_overlap_note = "instance/components/registry.toml is migrated before the broad instance/components/** preserve rule. A template keeps the inert template registry; an instance keeps its identity, adoption state, revision, entries and component bodies."
skill_overlap_note = "instance/skills/** is instance-owned and preserved. A template remains empty; an existing instance keeps requirements, installed routes, export indexes, generated packages and unknown fields byte-for-byte. The upgrade never creates, converts, checks, installs, shares, executes or removes a Skill."

[target_selection]
mode = "fixed-release-content-or-trusted-commit-allowlist"
forbid_unlisted_files = true
forbidden_segments = [".git", "node_modules", ".cache", ".vite", ".turbo", "coverage", "tmp", "temp", "maintainer-private", ".assistant-private", ".assistant-local"]
allow_overrides_deny_for_exact_paths = [".assistant-local/.gitkeep", ".assistant-local/dashboard/.gitkeep", ".assistant-local/indexes/.gitkeep", ".assistant-local/skills/.gitkeep", ".assistant-local/task-handoffs/.gitkeep", ".assistant-local/upgrade-inbox/.gitkeep", ".assistant-private/.gitkeep", ".assistant-private/assets/.gitkeep", ".assistant-private/inbox/.gitkeep"]
exact_override_policy = "only-listed-regular-zero-byte-files-may-override-forbidden-segments; directory-records-are-container-metadata-not-files"
broad_globs_are_copy_commands = false

[instance_component_changes]
schema = "1.0"
registry = "instance/components/registry.toml"
target_interfaces = ["agent-carry.instance-component@1"]
migration_ids = ["instance-component-adoption-1.4", "instance-component-interface-1.0"]
native_asset_policy = "reuse-existing-formal-owners-never-create-duplicate-component-manifests"
professional_extension_policy = "reuse-extension-toml-never-duplicate-in-generic-registry"
unregistered_policy = "preserve-and-stop-with-preview"
optional_incompatible_action = "disable-and-preserve"
required_incompatible_action = "stop-and-preserve"
device_local_policy = "preserve-in-place-on-same-device-never-copy-to-public-or-complete-migration-reverify-before-use"
ordinary_startup = "never-read-registry-enumerate-components-or-load-component-bodies"
authorization = "reuse-the-current-durable-action-authorization-never-add-a-compatibility-only-user-confirmation"

[[migration_rules]]
id = "long-session-upgrade-continuity-1.4.5"
from_versions = ["1.4.4"]
when_all = ["source reports product 1.4.4", "the official fixed v1.4.5 tag Release object manifest and extracted tree agree and the user authorized that exact upgrade", "upgrade runs in a new isolated candidate against a verified 1.4.4 template or instance"]
source = "the complete 1.4.4 tree plus its strictly parsed manifest identity-bound indexes component registry startup capsule snapshots preserved instance-owned Skills exports assets workspace local bindings private state and the running-conversation Agent Carry baseline recorded before switch"
destination = "an isolated 1.4.5 template or instance candidate with unchanged user-owned content a strict rebuilt capsule byte-identical snapshots and an explicit current-conversation adoption or bounded pending state"
operation_order = ["freeze the complete source-tree identity rollback point and current running-conversation Agent Carry product version instance ID and manifest digest before any candidate write", "strictly distinguish an uninstantiated template from an instantiated assistant before selecting the branch", "for a template use the fixed 1.4.5 blank template identity files together and keep instance_id=template state=template zero records zero candidates zero components no approved profile no Skill export index and no generated package", "for an instance preserve instance_id created_from direction profile learning policy maps signals governance hosts Skill requirements installed Skill routes export index generated Skill packages assets validation records candidate sources extensions components local bindings private references workspace and unknown fields", "update only the instantiated manifest product version from 1.4.4 to 1.4.5", "do not rerun first instantiation refresh an unchanged timestamp invent an asset validation candidate todo component Skill session or behavior fact or load unrelated component bodies", "rebuild the strict startup capsule from exact merged manifest bytes", "rebuild dashboard/public/snapshot.js and dashboard/dist/snapshot.js from merged formal truth and require byte identity", "compare every preserved path byte-for-byte and require a zero-change second file pass before switching", "after a verified switch wait until the current atomic action reaches a safe boundary then rerun the strict Agent Carry startup entry outside model context and compare target product version same instance ID and manifest digest", "load only the minimum target-version entry and relevant change rules check immutable host conflicts and automatically validate one real non-destructive representative behavior", "if immutable host rules block current-conversation reentry preserve the valid installed instance and unrelated capabilities and keep only the affected behavior pending; use a new run only as the last compatibility route"]
forbidden = ["upgrading from an unfixed branch archive or a tag without the matching official Release object", "re-running first instantiation against an existing instance", "changing instance identity created_from direction profile learning policy or user-owned fields", "inventing or promoting an asset validation candidate task result component approval Skill session activation fact or behavior result", "resetting an instance index registry Skill map export package signal host governance card extension workspace local binding private reference or unknown field to template state", "treating a host or Codex version as the Agent Carry product version", "treating a version string hash capsule snapshot static text or ordinary file reread as proof of current-conversation adoption", "requiring the user to type a test prompt inspect files judge internal state or create a new task when bounded current-conversation reentry is available", "rolling back a valid installed instance because reentry is pending or one representative behavior failed", "weakening startup capsule snapshot candidate component result-validation privacy secret or Skill package checks", "modifying the source tree or a real installed instance during rehearsal"]
unknown_or_ambiguous = "preserve the complete 1.4.4 source candidate and failure scene; report the exact file identity ownership session host constraint or behavior fact that is missing; isolate only the unsafe switch reentry or completion claim and keep unrelated capabilities usable"
idempotence = "same-source-second-file-run-makes-no-file-record-export-timestamp-or-snapshot-byte-change; repeated baseline checks in one substantive goal load no upgrade body and no session or behavior acceptance is inferred without real evidence"

[verification]
checks = ["manifest-parses", "version-1.4.5-and-existing-schema-versions-aligned", "only-1.4.4-is-a-direct-source-and-older-versions-chain-through-published-manifests", "published-1.4.4-manifest-remains-byte-immutable", "published-1.4.5-authority-requires-fixed-tag-release-object-matching-tree-and-user-authorization", "long-conversation-compares-agent-carry-version-instance-id-and-manifest-digest-before-each-new-substantive-goal", "same-goal-consecutive-replies-and-unchanged-baselines-load-no-upgrade-body", "host-product-version-is-never-used-as-agent-carry-product-version", "ordinary-file-reread-cannot-impersonate-adoption", "validated-current-session-reentry-requires-safe-boundary-strict-entry-minimum-rule-load-host-conflict-check-and-automatic-behavior-acceptance", "agent-not-user-runs-one-non-destructive-representative-behavior", "immutable-host-block-keeps-only-affected-behavior-pending-and-new-run-is-last-fallback", "blank-1.4.5-template-remains-byte-exact-empty", "uninstantiated-1.4.4-template-upgrades-to-byte-exact-blank-1.4.5", "instantiated-1.4.4-identity-assets-validation-evolution-components-extensions-workspace-local-private-skill-requirements-exports-and-unknown-fields-are-byte-preserved", "startup-capsule-is-rebuilt-after-version-migration-and-its-source-digest-closes", "merged-instance-truth-rebuilds-public-and-dist-snapshots-byte-identically", "patch-upgrade-faults-restore-complete-source-and-second-file-run-makes-no-change", "public-distribution-excludes-private-maintainer-assets-real-skills-exports-components-bindings-user-data-and-local-acceptance-evidence", "complete-tree-platform-identity-and-preserved-path-bytes-close-before-switch"]
risk_policy = "reuse the existing blank-startup and first-instantiation lifelines plus six high-information session cases and one synthetic complex 1.4.4 preservation fixture; do not add a browser matrix host matrix package ecosystem background poller or enterprise regression suite"

[release_boundary]
status = "published-release"
release_ref = "v1.4.5"
publication_authorized = true
repository_operation_authorized = true
instance_replacement_authorized = true
future_publication_or_repository_operation_authorized = false
authority_requires = ["official-fixed-tag-v1.4.5", "official-release-object-v1.4.5", "manifest-and-extracted-tree-match-the-fixed-tag", "user-explicitly-authorized-this-upgrade"]
authority_scope = "this-fixed-release-may-be-used-for-instance-replacement; never-authorizes-future-repository-release-or-publication-actions"
maintainer_private_paths = ["AGENTS.override.md", ".assistant-private/**", ".assistant-local/**", "maintainer-private/**", "workspace/**"]
