schema_version = 2
release = "1.4.8"
core = "1.4.8"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.3"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
private_asset_catalog_schema = "1.0"
migration_kit_schema = "2.0"
extension_manifest_schema = "1.0"
instance_component_schema = "1.0"
result_validation_evidence_schema = "1.0"
startup_capsule_schema = "1.0"
from_versions = ["1.4.7"]
notes = "Published 1.4.8 deterministic user-journey patch. First instantiation, ordinary learning persistence and shared Skill intake now have bundled local transaction entrypoints instead of requiring a model to hand-author formal identity or transaction fields. Each entry accepts a bounded semantic request, validates the real source and target, stages changes, reads them back and either commits the complete local result or preserves the preimage. Shared Skill scripts and dependencies remain inert during inspection and installation. A missing runtime, malformed request, conflict or derived-dashboard refresh fault is reported in natural language and contained to the current creation, learning item or Skill; conversation and unrelated capabilities remain available. Bounded readback may report verified presence or absence, while an unchecked state stays explicitly unknown. Existing 1.4.7 instance-owned identity, profile, assets, validation evidence, candidates, components, extensions, workspaces, local bindings, private content, Skills, export states, delivery carriers, task handoffs and unknown fields are preserved byte-for-byte. This fixed release can authorize an instance replacement only when the official v1.4.8 tag, Release object, manifest and extracted tree agree and the user authorizes that exact upgrade; it never authorizes future repository or publication actions."
asset_changes = "Asset Schema remains 1.3. Upgrade creates, promotes, resets, removes or rewrites no memory, capability, SOP, experience, candidate, validation record, component, Skill, receipt or user-owned file. The new learning entrypoint writes a formal asset only after its own exact preview and one real user choice during later use, never during upgrade."
dashboard_changes = "Dashboard Snapshot Schema remains 1.1 and Dashboard Action Schema remains 1.0. Blank template snapshots remain empty; existing instances rebuild both snapshots only from merged formal truth. A completed Skill installation remains valid if a later derived-dashboard refresh fails, and the dashboard is reported as pending refresh rather than rolling back the installed Skill. Pages changes because the product version projection advances."
extension_changes = "Extension API, Extension Manifest Schema and Instance Component Schema remain unchanged. Existing components, extensions, workspaces, installed Skills, exports, carriers, device-local bindings and unknown package fields are preserved byte-for-byte and none is loaded merely to accept the upgrade."

replace = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
replace_instance_guides = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md", "instance/validations/README.md", "instance/components/README.md"]
migrate = ["instance/manifest.toml", "instance/startup-capsule.toml", "instance/components/registry.toml", "instance/maps/domain-map.toml", "instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml", "instance/profile/**", "instance/governance/**", "instance/evolution/index.toml", "instance/validations/index.toml"]
preserve = ["workspace/**", "instance/components/**", "instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", "instance/validations/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[classification]
precedence = ["migration_rules", "replace_instance_guides", "migrate", "preserve", "replace", "remove"]
overlap_policy = "first-matching-classification-wins-after-applicable-migration-rules; every selected path must resolve to exactly one effective action"
guide_overlap_note = "Only the exact README files in replace_instance_guides are target-template guides. Sibling user files, Skill requirements, exports, carriers, component bodies, validation records and migrated profiles remain instance-owned."
validation_overlap_note = "instance/validations/index.toml is migrated before the broad instance/validations/** preserve rule. A template stays the target template empty index; an instance keeps its identity and every real validation record, and no record may be invented by this patch."
evolution_overlap_note = "instance/evolution/index.toml is migrated before the broad instance/evolution/** preserve rule. A template stays blank; an instance keeps candidate sources and its existing generated_at unless the indexed business projection actually changes."
component_overlap_note = "instance/components/registry.toml is migrated before the broad instance/components/** preserve rule. A template keeps the inert template registry; an instance keeps its identity, adoption state, revision, entries and component bodies."
skill_overlap_note = "instance/skills/** is instance-owned and preserved. A template remains empty; an existing instance keeps requirements, installed routes, export indexes, editable sources, generated packages, delivery carriers and unknown fields byte-for-byte."

[target_selection]
mode = "fixed-release-content-or-trusted-commit-allowlist"
forbid_unlisted_files = true
forbidden_segments = [".git", "node_modules", ".cache", ".vite", ".turbo", "coverage", "tmp", "temp", "maintainer-private", ".assistant-private", ".assistant-local"]
allow_overrides_deny_for_exact_paths = [".assistant-local/.gitkeep", ".assistant-local/dashboard/.gitkeep", ".assistant-local/indexes/.gitkeep", ".assistant-local/skills/.gitkeep", ".assistant-local/task-handoffs/.gitkeep", ".assistant-local/upgrade-inbox/.gitkeep", ".assistant-private/.gitkeep", ".assistant-private/assets/.gitkeep", ".assistant-private/inbox/.gitkeep"]
exact_override_policy = "only-listed-regular-zero-byte-files-may-override-forbidden-segments; directory-records-are-container-metadata-not-files"
broad_globs_are_copy_commands = false

[instance_component_changes]
schema = "1.0"
registry = "instance/components/registry.toml"
target_interfaces = ["agent-carry.instance-component@1"]
migration_ids = []
native_asset_policy = "reuse-existing-formal-owners-never-create-duplicate-component-manifests"
professional_extension_policy = "reuse-extension-toml-never-duplicate-in-generic-registry"
unregistered_policy = "preserve-and-stop-with-preview"
optional_incompatible_action = "disable-and-preserve"
required_incompatible_action = "stop-and-preserve"
device_local_policy = "preserve-in-place-on-same-device-never-copy-to-public-or-complete-migration-reverify-before-use"
ordinary_startup = "never-read-registry-enumerate-components-or-load-component-bodies"
authorization = "reuse-the-current-durable-action-authorization-never-add-a-compatibility-only-user-confirmation"

[[migration_rules]]
id = "deterministic-user-journeys-1.4.8"
from_versions = ["1.4.7"]
when_all = ["source reports product 1.4.7", "the official fixed v1.4.8 tag Release object manifest and extracted tree agree and the user authorized that exact upgrade", "upgrade runs in a new isolated candidate against a verified 1.4.7 template or instance"]
source = "the complete 1.4.7 tree plus its strictly parsed manifest identity-bound indexes component registry startup capsule snapshots and every preserved instance-owned asset Skill export carrier workspace local binding private reference task-local handoff and unknown field"
destination = "an isolated 1.4.8 template or instance candidate with byte-preserved user-owned content a strict rebuilt capsule byte-identical snapshots and deterministic first-instantiation learning-save and shared-Skill-install entrypoints available on demand"
operation_order = ["freeze the complete source-tree identity rollback point and current running-conversation Agent Carry product version instance ID and manifest digest before any candidate write", "strictly distinguish an uninstantiated template from an instantiated assistant before selecting the branch", "for a template use the fixed 1.4.8 blank template identity files together and keep instance_id=template state=template zero records zero candidates zero components no approved profile no Skill export index and no created user asset", "for an instance preserve instance_id created_from direction profile learning policy maps signals governance hosts assets validation records candidate sources extensions components workspaces local bindings private references Skills exports carriers unknown fields and any existing bounded task handoff bytes", "update only the instantiated manifest product version from 1.4.7 to 1.4.8", "do not execute first instantiation learning persistence Skill inspection Skill installation package code dependency installation or network access during upgrade", "rebuild the strict startup capsule from exact merged manifest bytes", "rebuild dashboard/public/snapshot.js and dashboard/dist/snapshot.js from merged formal truth and require byte identity", "compare every preserved path byte-for-byte and require a zero-change second file pass before switching", "after a verified switch use the existing bounded current-conversation reentry route at the next safe boundary and automatically validate one non-destructive affected entrypoint without modifying user assets", "if a new entrypoint or Node runtime is unavailable keep the upgraded assistant usable report the local degradation and limit only that creation learning or Skill action"]
forbidden = ["upgrading from an unfixed branch archive or a tag without the matching official Release object", "re-running first instantiation against an existing instance", "changing instance identity created_from direction profile learning policy or user-owned fields", "creating rewriting deleting or promoting any memory capability SOP experience candidate validation record Skill export carrier task handoff or unknown field", "executing a shared Skill script or installing its dependencies merely to inspect install or upgrade it", "turning a missing runtime malformed semantic request stale preview index drift or one derived snapshot refresh failure into a whole-instance failure", "claiming an unchecked task result Skill path or index entry is absent", "resetting an instance index registry Skill map signal host governance card extension workspace local binding private reference or unknown field to template state", "weakening startup capsule snapshot candidate component result-validation privacy secret archive-path or Skill package checks", "modifying the source tree or a real installed instance during rehearsal"]
unknown_or_ambiguous = "preserve the complete 1.4.7 source candidate and failure scene; report the exact identity ownership source byte semantic request or local runtime fact that is missing; isolate only the unsafe creation learning Skill switch or completion claim and keep the assistant conversation completed result and unrelated capabilities usable"
idempotence = "same-source-second-file-run-makes-no-file-record-asset-timestamp-installation-or-snapshot-byte-change; upgrade does not create a first-instantiation request learning preview Skill preview or operational receipt"

[verification]
checks = ["manifest-parses", "version-1.4.8-and-existing-schema-versions-aligned", "only-1.4.7-is-a-direct-source-and-older-versions-chain-through-published-manifests", "published-1.4.7-manifest-remains-byte-immutable", "published-1.4.8-authority-requires-fixed-tag-release-object-matching-tree-and-user-authorization", "blank-1.4.8-template-remains-byte-exact-empty", "uninstantiated-1.4.7-template-upgrades-to-byte-exact-blank-1.4.8", "instantiated-1.4.7-identity-assets-validation-evolution-components-extensions-workspace-local-private-skills-exports-carriers-task-handoffs-and-unknown-fields-are-byte-preserved", "first-instantiation-transaction-closes-all-identity-files-and-rolls-back-one-injected-fault", "learning-save-preview-confirm-readback-and-idempotence-close-without-model-authored-transaction-fields", "shared-skill-preview-is-source-digest-target-bound-and-one-confirmation-installs-registers-without-executing-package-code", "same-name-different-byte-and-unsafe-skill-faults-remain-local-to-one-package", "unchecked-state-remains-not-checked-and-is-never-reported-as-absent", "startup-capsule-is-rebuilt-after-version-migration-and-its-source-digest-closes", "merged-instance-truth-rebuilds-public-and-dist-snapshots-byte-identically", "patch-upgrade-fault-restores-complete-source-and-second-file-run-makes-no-change", "public-distribution-excludes-private-maintainer-assets-real-learning-real-skills-carriers-links-components-bindings-user-data-and-local-acceptance-evidence", "complete-tree-platform-identity-and-preserved-path-bytes-close-before-switch"]
risk_policy = "reuse the canonical blank-template first-instantiation lifeline and the focused learning and Skill transaction checks; add one synthetic 1.4.7 preservation case; do not add a host matrix background service marketplace task database package ecosystem matrix or enterprise regression suite"

[release_boundary]
status = "published-release"
release_ref = "v1.4.8"
publication_authorized = true
repository_operation_authorized = true
instance_replacement_authorized = true
future_publication_or_repository_operation_authorized = false
authority_requires = ["official-fixed-tag-v1.4.8", "official-release-object-v1.4.8", "manifest-and-extracted-tree-match-the-fixed-tag", "user-explicitly-authorized-this-upgrade"]
authority_scope = "this-fixed-release-may-be-used-for-instance-replacement; never-authorizes-future-repository-release-or-publication-actions"
maintainer_private_paths = ["AGENTS.override.md", ".assistant-private/**", ".assistant-local/**", "maintainer-private/**", "workspace/**"]
