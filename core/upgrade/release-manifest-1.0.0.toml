schema_version = 1
release = "1.0.0"
core = "1.0.0"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.2"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
migration_kit_schema = "1.0"
from_versions = []
notes = "Fresh Agent Carry baseline licensed under Apache-2.0; Asset Schema 1.2 adds risk-tiered activation, evidence maturity, host execution references and optional local private_refs. Dashboard Snapshot Schema 1.1 adds low-sensitive source, suggested target and next-step summaries for visible learning candidates while remaining compatible with 1.0 snapshots. Source/contract-bound results, durable multi-file changes and learning evidence now use one task-local result-validation gate; only validated outcomes count as successful evidence, without adding startup state or user-run enterprise regression. Link and archive distributions share one Agent-guided installation contract and create a rebuildable visible dashboard shortcut without requiring Git or development dependencies. Instantiation now treats guidance style and assistant direction as independent choices: step-by-step, balanced and direct guidance can each create a general or domain instance, while help-decide remains a pre-lock comparison rather than a third direction. Guidance style is a mutable communication preference, not a user capability score or model Level; direction remains permanently locked after the user confirms the full preview. The current execution model may process task-needed privacy, while secret credentials never enter a model, Git or migration package. GitHub private backup first builds and scans a local safe copy, then requires a repository preview confirmation before creating or pushing to the user's personal private repository without automatic collaborators; local private packages remain a separate, non-uploaded action and include only stable-reference content. The dashboard summarizes asset formation and experience use in compact flows, explains memory as automatic route-hit loading with optional manual selection, opens complete origin, maturity, review and reuse guidance only on request, and separates same-computer Agent connection from complete computer migration. Its clickable local snapshot status shares one health decision with the system page, explains meaning and recovery for ready, template, unavailable, missing/invalid/future/stale time and refresh-failure states, and explicitly distinguishes local dashboard freshness from GitHub or cloud sync. The public README may link to a GitHub Pages preview built from the same dashboard UI and a visibly marked synthetic snapshot, while public main, release archives and installed templates remain empty and contain no mock fixture. Same-computer connection reuses one asset master; complete migration creates a clean assistant-body package, a separate local privacy package, a fixed START-RESTORE.md entry and checksums, with GitHub remaining optional and secret credentials excluded. Existing 1.1 assets remain readable with conservative defaults and migrate only when touched. Governance card bodies come from the target template while per-instance schedule and completion state migrate by stable card ID. No automatic migration from the former 2.x prototype."

replace = ["README.md", "INSTALL.md", "START-HERE.txt", "AGENTS.md", "BOOTSTRAP.md", "assistant.toml", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
migrate = ["instance/manifest.toml", "instance/maps/domain-map.toml", "instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml", "instance/profile/**", "instance/governance/**"]
preserve = ["instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[verification]
checks = ["manifest-parses", "project-license-apache-2.0-valid", "third-party-provenance-and-licenses-valid", "direction-lock-preserved", "guidance-mode-and-direction-independent", "adaptive-instantiation-path-valid", "learning-policy-valid", "privacy-boundary-valid", "asset-risk-approval-maturity-valid", "result-validation-gate-valid", "private-refs-valid", "map-targets-exist", "trigger-registry-complete", "governance-card-body-current-and-instance-schedule-preserved", "wake-capsule-aggregate-valid", "time-trigger-index-valid", "host-integration-contract-valid", "task-capsule-safety-valid", "host-profiles-preserved", "agent-guided-installation-valid", "git-safe-and-private-export-actions-aligned", "complete-migration-kit-contract-valid", "redacted-secret-scan-valid", "secret-exclusion-valid", "schemas-aligned", "dashboard-learning-candidate-visibility-valid", "dashboard-actions-aligned", "dashboard-offline-responsive-valid", "snapshot-rebuilt"]
risk_policy = "targeted-not-enterprise-regression"
