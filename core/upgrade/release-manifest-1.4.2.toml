schema_version = 2
release = "1.4.2"
core = "1.4.2"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.3"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
private_asset_catalog_schema = "1.0"
migration_kit_schema = "2.0"
extension_manifest_schema = "1.0"
instance_component_schema = "1.0"
result_validation_evidence_schema = "1.0"
startup_capsule_schema = "1.0"
from_versions = ["1.4.1"]
notes = "Published 1.4.2 user-continuity patch. It gives actual-use and meaningful-stage learning receipts stable visual identities, keeps them brief and separate, and always returns the final reply to one plain-language next action or an explicit no-action conclusion. Approved assets may be recalled from bounded current-work signals at task start and meaningful goal, action, verified-state or result changes; current user correction always wins and internal routing details stay hidden. The patch adds no background scanner, second learning system, extra confirmation, new public Schema or enterprise regression matrix. Existing 1.4.1 instances preserve all identity, assets, evidence, candidates, components, extensions, workspaces, local bindings and private state; only the product version and derived startup capsule and snapshots advance. This fixed release can authorize an instance replacement only when the official v1.4.2 tag, Release object, manifest and extracted tree agree and the user authorizes that exact upgrade; it never authorizes future repository or publication actions."
asset_changes = "Asset Schema remains 1.3. A use receipt is emitted only after an approved memory, capability, experience or SOP body affects the work. A separate learning receipt distinguishes an observation from learning that has been atomically saved, strictly read back and recalled through ordinary language. Neither receipt creates, promotes or approves an asset by itself."
dashboard_changes = "Dashboard Snapshot Schema remains 1.1. The blank template and existing instance projections keep their prior counts and ownership. Product-version projections advance to 1.4.2, and public/dist snapshots are regenerated byte-identically from the same formal source."
extension_changes = "Extension API, Extension Manifest Schema and Instance Component Schema remain unchanged. Existing registered workspaces, components, device-local bindings and private references are preserved; this patch installs, executes, moves or adopts none of them."

replace = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
replace_instance_guides = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md", "instance/validations/README.md", "instance/components/README.md"]
migrate = ["instance/manifest.toml", "instance/startup-capsule.toml", "instance/components/registry.toml", "instance/maps/domain-map.toml", "instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml", "instance/profile/**", "instance/governance/**", "instance/evolution/index.toml", "instance/validations/index.toml"]
preserve = ["workspace/**", "instance/components/**", "instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", "instance/validations/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[classification]
precedence = ["migration_rules", "replace_instance_guides", "migrate", "preserve", "replace", "remove"]
overlap_policy = "first-matching-classification-wins-after-applicable-migration-rules; every selected path must resolve to exactly one effective action"
guide_overlap_note = "Only the exact README files in replace_instance_guides are target-template guides. Sibling user files, component bodies, validation records and migrated profiles remain instance-owned."
validation_overlap_note = "instance/validations/index.toml is migrated before the broad instance/validations/** preserve rule. A template stays the target template empty index; an instance keeps its identity and every real validation record, and no record may be invented by this patch."
evolution_overlap_note = "instance/evolution/index.toml is migrated before the broad instance/evolution/** preserve rule. A template stays blank; an instance keeps candidate sources and its existing generated_at unless the indexed business projection actually changes."
component_overlap_note = "instance/components/registry.toml is migrated before the broad instance/components/** preserve rule. A template keeps the inert template registry; an instance keeps its identity, adoption state, revision, entries and component bodies."

[target_selection]
mode = "fixed-release-content-or-trusted-commit-allowlist"
forbid_unlisted_files = true
forbidden_segments = [".git", "node_modules", ".cache", ".vite", ".turbo", "coverage", "tmp", "temp", "maintainer-private", ".assistant-private", ".assistant-local"]
allow_overrides_deny_for_exact_paths = [".assistant-local/.gitkeep", ".assistant-local/dashboard/.gitkeep", ".assistant-local/indexes/.gitkeep", ".assistant-local/skills/.gitkeep", ".assistant-local/task-handoffs/.gitkeep", ".assistant-local/upgrade-inbox/.gitkeep", ".assistant-private/.gitkeep", ".assistant-private/assets/.gitkeep", ".assistant-private/inbox/.gitkeep"]
exact_override_policy = "only-listed-regular-zero-byte-files-may-override-forbidden-segments; directory-records-are-container-metadata-not-files"
broad_globs_are_copy_commands = false

[instance_component_changes]
schema = "1.0"
registry = "instance/components/registry.toml"
target_interfaces = ["agent-carry.instance-component@1"]
migration_ids = ["instance-component-adoption-1.4", "instance-component-interface-1.0"]
native_asset_policy = "reuse-existing-formal-owners-never-create-duplicate-component-manifests"
professional_extension_policy = "reuse-extension-toml-never-duplicate-in-generic-registry"
unregistered_policy = "preserve-and-stop-with-preview"
optional_incompatible_action = "disable-and-preserve"
required_incompatible_action = "stop-and-preserve"
device_local_policy = "preserve-in-place-on-same-device-never-copy-to-public-or-complete-migration-reverify-before-use"
ordinary_startup = "never-read-registry-enumerate-components-or-load-component-bodies"
authorization = "reuse-the-current-durable-action-authorization-never-add-a-compatibility-only-user-confirmation"

[[migration_rules]]
id = "receipt-and-guidance-continuity-1.4.2"
from_versions = ["1.4.1"]
when_all = ["source reports product 1.4.1", "the official fixed v1.4.2 tag Release object manifest and extracted tree agree and the user authorized that exact upgrade", "upgrade runs in a new isolated candidate against a verified 1.4.1 template or instance"]
source = "the complete 1.4.1 tree plus its strictly parsed manifest, identity-bound indexes, component registry, startup capsule, snapshots and preserved instance-owned content"
destination = "an isolated 1.4.2 template or instance candidate with unchanged user-owned content and the stable receipt and final-guidance product rules"
operation_order = ["freeze the complete source-tree identity and rollback point before any candidate write", "strictly distinguish an uninstantiated template from an instantiated assistant before selecting the branch", "for a template use the fixed 1.4.2 blank template identity files together and keep instance_id=template state=template zero records zero candidates zero components and no approved profile", "for an instance preserve instance_id created_from direction profile learning policy maps signals governance hosts Skills assets validation records candidate sources extensions components local bindings private references workspace and unknown fields", "update only the instantiated manifest product version from 1.4.1 to 1.4.2", "do not rerun first instantiation refresh an unchanged candidate timestamp or invent an asset validation candidate todo component or approval", "rebuild the strict startup capsule from exact merged manifest bytes", "rebuild dashboard/public/snapshot.js and dashboard/dist/snapshot.js from merged formal truth and require byte identity", "compare every preserved path byte-for-byte and require a zero-change second run before switching"]
forbidden = ["re-running first instantiation against an existing instance", "changing instance identity created_from direction profile learning policy or user-owned fields", "inventing or promoting an asset validation candidate task result component or approval", "resetting an instance index registry signal host governance card extension workspace local binding or private reference to template state", "weakening startup capsule snapshot candidate component or result-validation checks", "modifying the source tree or a real installed instance during rehearsal"]
unknown_or_ambiguous = "preserve the complete 1.4.1 source and failure scene, report the exact identity or ownership conflict and stop before switching"
idempotence = "same-source-second-run-makes-no-file-record-timestamp-or-snapshot-byte-change"

[verification]
checks = ["manifest-parses", "version-1.4.2-and-existing-schema-versions-aligned", "only-1.4.1-is-a-direct-source-and-older-versions-chain-through-published-manifests", "published-1.4.1-manifest-remains-byte-immutable", "published-1.4.2-authority-requires-fixed-tag-release-object-matching-tree-and-user-authorization", "actual-use-receipt-has-stable-brain-heading-and-requires-body-impact", "learning-receipt-has-stable-sprout-heading-finding-status-and-future-use-icons", "receipts-precede-the-final-localized-user-action-guidance", "final-guidance-gives-one-evidence-based-next-step-options-only-for-real-consequence-differences-or-an-explicit-no-action-conclusion", "bounded-work-signals-recall-only-approved-uniquely-scoped-assets-at-meaningful-work-transitions", "current-user-negation-and-correction-override-work-signal-recall", "ordinary-startup-gains-no-background-scan-second-learning-system-extra-confirmation-or-component-registry-read", "blank-1.4.2-template-startup-capsule-valid", "one-canonical-blank-template-completes-general-and-video-editing-first-instantiation", "first-instantiation-business-and-learning-assets-remain-zero-while-governance-is-three", "uninstantiated-1.4.1-template-upgrades-to-byte-exact-blank-1.4.2", "instantiated-1.4.1-identity-assets-validation-evolution-components-extensions-workspace-local-and-private-state-are-byte-preserved", "startup-capsule-is-rebuilt-after-version-migration-and-its-source-digest-closes", "merged-instance-truth-rebuilds-public-and-dist-snapshots-byte-identically", "patch-upgrade-faults-restore-complete-source-and-second-run-makes-no-change", "public-distribution-excludes-private-maintainer-assets-real-components-bindings-and-user-data", "complete-tree-platform-identity-and-preserved-path-bytes-close-before-switch"]
risk_policy = "reuse the existing blank-startup and two-scenario first-instantiation lifelines plus one change-targeted receipt-guidance contract and one lightweight 1.4.1 patch-preservation rehearsal; broader matrices remain change-triggered and internal"

[release_boundary]
status = "published-release"
release_ref = "v1.4.2"
publication_authorized = true
repository_operation_authorized = true
instance_replacement_authorized = true
future_publication_or_repository_operation_authorized = false
authority_requires = ["official-fixed-tag-v1.4.2", "official-release-object-v1.4.2", "manifest-and-extracted-tree-match-the-fixed-tag", "user-explicitly-authorized-this-upgrade"]
authority_scope = "this-fixed-release-may-be-used-for-instance-replacement; never-authorizes-future-repository-release-or-publication-actions"
maintainer_private_paths = ["AGENTS.override.md", ".assistant-private/**", ".assistant-local/**", "maintainer-private/**", "workspace/**"]
