schema_version = 2
release = "2.0.0"
core = "2.0.0"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.3"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
private_asset_catalog_schema = "1.0"
migration_kit_schema = "2.0"
extension_manifest_schema = "1.0"
instance_component_schema = "1.0"
result_validation_evidence_schema = "1.0"
startup_capsule_schema = "1.0"
from_versions = ["1.4.8", "1.4.9"]
required_preview_executor = "dashboard/scripts/ai-carry-upgrade-cli.mjs"
required_preview_command = "prepare --source <current-instance-root> --target <verified-extracted-target-root>"
required_preview_policy = "on an explicit update check the CLI must use GitHub HTTPS API live verification to bind the latest non-draft non-prerelease Release exact versioned Release direct lightweight tag commit public main exact Git tree target bytes and release manifest; caller-authored JSON and target self-report are not authority; prepare remains read-only and displays returned userPreview verbatim"
required_confirm_policy = "after displaying the exact bound preview the host Agent must wait for the user's next independent reply to be exactly upgrade or confirm-upgrade before running the returned confirmCommand; the user does not operate a terminal; the CLI revalidates Release target state reference and reply string but honestly does not authenticate chat roles, which remains the host conversation boundary rather than a simulated permission sandbox"
required_session_reentry_policy = "after a file switch run only the returned sessionReentryCommand; it validates target runtime files and the rollback package but keeps current-session activation and behavior acceptance pending; the generic JSON evaluator never promotes caller-authored passed fields to completion"
notes = "Published AI Carry 2.0.0 product-identity migration. The product is renamed from Agent Carry to AI Carry across current user-visible copy and newly generated machine identities. Existing public 1.4.8 instances and local unreleased 1.4.9 instances are direct sources: only manifest-owned product paths switch to AI Carry, while instance identity created_from history profiles assets validation evidence candidates components extensions workspaces local bindings private content Skills requirements exports editable sources delivery carriers task handoffs and unknown user-owned files remain in place. Workspaces local/private layers and unknown root files are not enumerated copied or removed. Legacy component record types and agent-carry.instance-component@1 remain readable through an explicit compatibility alias; new components use ai-carry.instance-component@1. New snapshots use AI_CARRY globals and expose bounded AGENT_CARRY aliases for old cached pages. New migration folders use AI-Carry names while old Agent-Carry names remain read-only aliases. The official GitHub repository still uses the Agent-Carry slug until a separate authorized remote rename. The 1.4.9 same-Skill upgrade and problem-report capabilities are folded into this release. This fixed release can authorize instance replacement only when the official v2.0.0 tag, Release object, manifest and extracted tree agree and the user authorizes that exact upgrade; it never authorizes future repository, publication or repository-rename actions."
asset_changes = "Asset Schema remains 1.3. Brand migration creates promotes resets removes or rewrites no memory capability SOP experience candidate validation record component Skill export carrier problem report receipt or user-owned file. Stable Skill identity version metadata and the existing generated-but-unshared state remain unchanged unless the user later performs that separate Skill action."
dashboard_changes = "Dashboard Snapshot Schema remains 1.1 and Dashboard Action Schema remains 1.0. Current UI copy titles accessibility labels actions generated snapshots and offline entry pages use AI Carry. New snapshots publish AI_CARRY globals plus read-only one-major-version AGENT_CARRY aliases so an old cached page does not turn a successful upgrade into a blank dashboard. Existing instances rebuild both snapshots only from merged formal truth. New Pages output requires the current AI Carry product name and current AI_CARRY envelope; legacy Agent Carry envelopes remain readable only as bounded input compatibility."
extension_changes = "Extension API Extension Manifest Schema and Instance Component Schema remain 1.0. The current native component interface is ai-carry.instance-component@1 and the target also provides the legacy agent-carry.instance-component@1 alias. Existing component registries manifests extensions workspaces installed Skills requirements exports editable sources carriers device-local bindings and unknown fields stay byte-preserved; one incompatible optional component remains locally isolated rather than stopping the assistant."

replace = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
replace_instance_guides = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md", "instance/validations/README.md", "instance/components/README.md"]
migrate = ["instance/manifest.toml", "instance/startup-capsule.toml"]
preserve = ["workspace/**", "instance/components/**", "instance/maps/**", "instance/profile/**", "instance/governance/**", "instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", "instance/validations/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[classification]
precedence = ["migration_rules", "replace_instance_guides", "migrate", "preserve", "replace", "remove"]
overlap_policy = "first-matching-classification-wins-after-applicable-migration-rules; every selected path must resolve to exactly one effective action"
guide_overlap_note = "Only the exact README files in replace_instance_guides are target-template guides. Every sibling profile map governance Skill component validation candidate report and user file remains instance-owned."
validation_overlap_note = "A clean template uses the target empty validation index. An existing instance keeps instance/validations/index.toml and every real validation record byte-for-byte; no record is invented by this patch."
evolution_overlap_note = "A clean template uses the target empty candidate index. An existing instance keeps instance/evolution/index.toml candidate sources and generated_at byte-for-byte because the indexed business projection does not change."
component_overlap_note = "A clean template uses the target ai-carry registry. An existing instance keeps registry and component bytes, including legacy agent-carry record types and interface requirements, which the target reads through explicit aliases."
skill_overlap_note = "instance/skills/** is instance-owned and preserved. A template remains empty; an existing instance keeps requirements installed routes export indexes editable sources generated packages delivery carriers and unknown fields byte-for-byte. Upgrade does not infer versions rewrite legacy entries or install a package."

[target_selection]
mode = "fixed-release-content-or-trusted-commit-allowlist"
forbid_unlisted_files = true
forbidden_segments = [".git", "node_modules", ".cache", ".vite", ".turbo", "coverage", "tmp", "temp", "maintainer-private", ".assistant-private", ".assistant-local"]
allow_overrides_deny_for_exact_paths = [".assistant-local/.gitkeep", ".assistant-local/dashboard/.gitkeep", ".assistant-local/indexes/.gitkeep", ".assistant-local/skills/.gitkeep", ".assistant-local/task-handoffs/.gitkeep", ".assistant-local/upgrade-inbox/.gitkeep", ".assistant-private/.gitkeep", ".assistant-private/assets/.gitkeep", ".assistant-private/inbox/.gitkeep"]
exact_override_policy = "only-listed-regular-zero-byte-files-may-override-forbidden-segments; directory-records-are-container-metadata-not-files"
broad_globs_are_copy_commands = false

[instance_component_changes]
schema = "1.0"
registry = "instance/components/registry.toml"
target_interfaces = ["ai-carry.instance-component@1", "agent-carry.instance-component@1"]
migration_ids = ["product-identity-agent-carry-to-ai-carry-2.0"]
native_asset_policy = "reuse-existing-formal-owners-never-create-duplicate-component-manifests"
professional_extension_policy = "reuse-extension-toml-never-duplicate-in-generic-registry"
unregistered_policy = "preserve-and-stop-with-preview"
optional_incompatible_action = "disable-and-preserve"
required_incompatible_action = "stop-and-preserve"
device_local_policy = "preserve-in-place-on-same-device-never-copy-to-public-or-complete-migration-reverify-before-use"
ordinary_startup = "never-read-registry-enumerate-components-or-load-component-bodies"
authorization = "reuse-the-current-durable-action-authorization-never-add-a-compatibility-only-user-confirmation"

[[migration_rules]]
id = "agent-carry-to-ai-carry-product-identity-2.0.0"
from_versions = ["1.4.8", "1.4.9"]
when_all = ["source reports product 1.4.8 or local unreleased 1.4.9 with recognized Agent Carry or AI Carry identity", "the official latest Release versioned v2.0.0 Release direct lightweight tag public main manifest and extracted public tree agree and the user authorizes that exact upgrade", "upgrade runs through dashboard/scripts/ai-carry-upgrade-cli.mjs against a physical archive instance or verified official public clone and a separate pure public target"]
source = "bounded product-owned path preimages plus the strict instance formal tree needed to rebuild manifest capsule and snapshots; workspace local private and unknown root bodies remain outside the read and write set"
destination = "an atomically updated stable-root AI Carry 2.0.0 instance whose manifest-owned product paths use current identity while all unowned source paths remain in place; changed product preimages are retained in a manifest-bound rollback package"
operation_order = ["on an explicit update check use GitHub HTTPS API live verification to require the latest non-draft non-prerelease Release to be v2.0.0 require the fixed v2.0.0 tag to point directly to one commit require public main to equal that commit and compare every target file with its Git tree; never accept caller-authored evidence JSON or fixture markers", "require the target release_boundary to be published and to authorize instance replacement", "parse replace replace_instance_guides migrate preserve and remove from the target release manifest; reject forbidden unlisted conflicting or nonzero private/local target paths before selecting a write set", "prepare reads only bounded product paths instance formal files component control records and workspace extension manifests; it never scans workspace bodies local/private layers or unknown roots", "strictly distinguish a clean template from an instantiated assistant before selecting the branch", "for a template update only classified target paths and keep instance_id=template state=template zero business assets zero records zero candidates zero components no approved profile no installed Skill and no export index", "for an instance overlay only the source instance formal tree into an isolated target candidate then restore target-owned instance guide READMEs", "preserve instance_id created_from direction profile learning policy maps signals governance hosts assets validation records candidates components extensions workspaces local bindings private references Skills requirements exports editable sources carriers reports handoffs future fields and unknown files", "update only the instantiated manifest product version from 1.4.8 or 1.4.9 to 2.0.0 while leaving created_from history unchanged", "accept legacy component registry and manifest record types and provide both current and legacy component interfaces without rewriting component bytes", "unregistered workspace control records or component actions needing a state write return review-required and pause only this upgrade", "do not inspect import install upgrade downgrade or rewrite an existing Skill and do not create or send a problem report during product upgrade", "before mutation reject source-root reparse points case or Unicode collisions and Windows touched files with named streams protected or explicit DACL owner drift read-only system or encrypted attributes; do not alter permissions or metadata to force an upgrade", "after displaying the bound preview wait for the user's next independent exact confirmation and only then run its confirmCommand; the user does not operate a terminal and the CLI does not pretend to authenticate chat roles", "rebuild the strict startup capsule from merged manifest bytes with capsule_id=ai-carry-startup", "rebuild dashboard/public/snapshot.js and dashboard/dist/snapshot.js from merged formal truth and require byte identity", "read back candidate-consumed instance paths byte-for-byte and re-run strict startup snapshot and component checks before switching", "keep the currently opened source root path stable and transactionally replace only manifest-classified files whose candidate bytes differ; never infer removals", "write every changed product preimage and every newly-created directory marker into a bounded rollback package before installing new bytes", "if any in-place mutation or post-switch validation fails reverse completed operations restore every touched product path remove only transaction-created directories that are still empty and preserve the candidate rollback package and transaction scene", "after a verified switch remove only the successful candidate and retain the rollback package; cleanup failure is reported without invalidating the installed instance", "a preserved failure scene consumes one bounded attempt number and a retry uses the next number without deleting history", "a second invocation against an installed 2.0.0 root first validates startup identity and both snapshots then returns already-current without refreshing files or time", "after a verified switch the returned reentry command validates only target runtime files; generic caller-authored session or behavior JSON remains pending without a trusted host adapter"]
forbidden = ["upgrading from an unfixed branch archive or a tag without the matching official Release object", "using a Git worktree development checkout or dependency tree as the live source", "re-running first instantiation against an existing instance", "mechanically replacing Agent Carry text inside created_from user assets external Skills historical records audit evidence or unknown user files", "changing instance identity direction profile learning policy or user-owned fields", "creating rewriting deleting or promoting any memory capability SOP experience candidate validation record Skill requirement export editable source carrier problem report task handoff or unknown field during upgrade", "executing a shared Skill component or workspace script or installing its dependencies", "automatically uploading sending filing committing publishing renaming a GitHub repository or deleting the retained rollback root", "turning one optional legacy component one stale snapshot one old generated-but-unshared Skill or one compatibility alias into a whole-assistant failure", "weakening startup capsule snapshot candidate component result-validation privacy secret archive-path or Skill package checks", "modifying a real installed instance during rehearsal"]
unknown_or_ambiguous = "leave unknown source paths in place and outside the write set; preserve candidate rollback package and failure scene; report the exact identity ownership control path or runtime fact that is missing; isolate only this upgrade or optional component while the original assistant conversation completed results and unrelated capabilities remain usable"
idempotence = "same-installed-source-second-run-first-live-verifies-the-official-release-fixed-tag-target-tree-and-static-product-bytes-then-returns-already-current-with-no-file-record-asset-timestamp-package-report-or-snapshot-byte-change; upgrade does not create a Skill preview install upgrade problem-report request report or operational receipt"

[verification]
already_current_authority = "a local version string never proves current status; the same-version path must live-verify the latest official Release exact versioned Release direct lightweight tag public main exact target tree published replacement boundary core capsule snapshots and local static product bytes before returning already-current"
copied_target_closure = "confirm must re-hash the isolated copied target before instance overlay and reject any drift from the prepared target tree fingerprint"
staging_recovery = "each same-directory staging file is recorded before copy and includes the numbered attempt so validation failures clean it and an interrupted old attempt cannot block the next attempt"
network_reporting = "prepare confirm and same-version official checks report network use truthfully"
windows_metadata_closure = "touched hardlinks named streams and failures to enumerate either are review-required before switch; never silently break hardlink topology or treat an inspection failure as absence"
checks = ["manifest-parses", "version-2.0.0-and-existing-schema-versions-aligned", "direct-sources-are-public-1.4.8-and-local-unreleased-1.4.9", "published-1.4.8-and-local-1.4.9-history-remain-auditable", "published-2.0.0-authority-requires-latest-release-versioned-release-lightweight-tag-public-main-matching-tree-and-user-authorization", "published-release-still-authorizes-no-future-publication-repository-operation-or-repository-rename", "live-github-latest-release-versioned-release-lightweight-tag-public-main-git-tree-and-target-bytes-close-without-caller-authored-evidence", "manifest-driven-write-set-rejects-unlisted-forbidden-private-and-local-target-content", "nonexact-or-prepreview-confirmation-returns-unverified-and-writes-nothing", "host-waits-for-an-independent-user-confirmation-before-confirm", "windows-nondefault-touched-file-metadata-stops-for-review-without-permission-changes", "blank-2.0.0-template-remains-empty-and-writes-only-ai-carry-current-identities", "uninstantiated-1.4.8-template-upgrades-without-removing-unknown-source-paths", "complex-instantiated-1.4.8-identity-created-from-assets-validation-evolution-components-extensions-workspace-local-private-skills-requirements-exports-editable-sources-carriers-problem-reports-task-handoffs-future-fields-and-unknown-files-remain-preserved", "large-workspace-bodies-are-not-enumerated-or-copied", "workspace-review-prevents-only-the-upgrade-switch", "legacy-component-record-types-and-agent-carry-interface-remain-compatible-while-new-components-use-ai-carry-interface", "component-state-change-actions-remain-review-required-until-reversible-isolation-exists", "new-snapshot-envelope-uses-ai-carry-globals-and-old-snapshot-and-cached-page-combinations-remain-readable", "old-private-migration-package-type-remains-readable-while-new-packages-use-ai-carry-type", "new-migration-folder-names-use-ai-carry-while-old-names-are-read-only-aliases", "new-generated-skill-has-stable-identity-and-semantic-version-while-legacy-generated-unshared-and-installed-packages-remain-readable", "same-skill-upgrade-and-problem-report-1.4.9-capabilities-remain-present", "startup-capsule-is-rebuilt-with-ai-carry-id-after-version-migration-and-its-source-digest-closes", "merged-instance-truth-rebuilds-public-and-dist-snapshots-byte-identically", "current-working-directory-root-upgrades-without-renaming-the-root", "fault-before-switch-leaves-source-usable-and-fault-after-first-product-mutation-restores-all-touched-paths-and-empty-created-directories", "preserved-failure-scene-does-not-block-a-numbered-retry", "already-current-validates-startup-identity-and-snapshot-pair-before-zero-change-return", "generic-session-json-never-self-attests-session-or-behavior", "public-distribution-excludes-private-maintainer-assets-real-learning-real-skills-carriers-links-components-bindings-user-data-reports-task-handoffs-future-fields-and-unknown-files", "every-agent-carry-residual-is-classified-per-match-as-history-compatibility-alias-or-current-legacy-repository-url"]
risk_policy = "run one clean template transaction harness one complex public-1.4.8 preserved-instance transaction harness two switch fault points one second-run health check one lower-cost-model safe-preview-and-refusal journey one pure public build and two independent rename audits; an isolated rehearsal must not fake the live GitHub Release or user-interactive confirmation required by the real path; do not add a host matrix background service marketplace database log collector or enterprise regression suite"

[release_boundary]
status = "published-release"
release_ref = "v2.0.0"
publication_authorized = true
repository_operation_authorized = true
instance_replacement_authorized = true
future_publication_or_repository_operation_authorized = false
authority_requires = ["official-latest-release-is-v2.0.0", "official-release-object-v2.0.0", "official-lightweight-tag-v2.0.0", "official-public-main-equals-v2.0.0-tag", "manifest-and-extracted-tree-match-the-fixed-tag", "user-explicitly-authorized-this-upgrade"]
authority_scope = "this-fixed-release-may-be-used-for-instance-replacement; never-authorizes-future-repository-release-publication-or-rename-actions"
maintainer_private_paths = ["AGENTS.override.md", ".assistant-private/**", ".assistant-local/**", "maintainer-private/**", "workspace/**"]
