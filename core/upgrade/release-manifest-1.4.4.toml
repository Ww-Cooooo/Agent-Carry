schema_version = 2
release = "1.4.4"
core = "1.4.4"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.3"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
private_asset_catalog_schema = "1.0"
migration_kit_schema = "2.0"
extension_manifest_schema = "1.0"
instance_component_schema = "1.0"
result_validation_evidence_schema = "1.0"
startup_capsule_schema = "1.0"
from_versions = ["1.4.3"]
notes = "Published 1.4.4 Skill Workshop release. It adds an on-demand desktop workshop that recommends eligible methods without converting them, copies only a user-selected formal method into an isolated local draft for Agent-led sanitization and generalization, and inspects shared Skills read-only before any installation. Inspection never executes scripts, installs dependencies, logs into accounts or silently rewrites a package. One package can become ready, review or isolated without disabling Agent Carry, conversation or unrelated Skills. The export index is created only after a real export and stays out of ordinary startup. This fixed release can authorize an instance replacement only when the official v1.4.4 tag, Release object, manifest and extracted tree agree and the user authorizes that exact upgrade; it never authorizes future repository or publication actions."
asset_changes = "Asset Schema remains 1.3. The release adds Skill Export Index Schema 1.0 as an on-demand instance-owned index. It is absent from the blank template and is created only when the user actually generates a local Skill. No memory, capability, SOP, experience, candidate, validation record, component, Skill, workspace, local binding or private reference is created, promoted, reset, shared, installed or removed by the upgrade."
dashboard_changes = "Dashboard Snapshot Schema remains 1.1 and Dashboard Action Schema remains 1.0. The snapshot can project low-sensitivity Skill recommendations, generated-Skill summaries and installed-Skill routes; the dashboard adds four desktop workshop tabs and bounded copy-to-Agent actions, but never executes a conversion, review, installation, upload or publication itself."
extension_changes = "Extension API, Extension Manifest Schema and Instance Component Schema remain unchanged. Existing components, extensions, workspaces, installed Skills, local export packages and device-local bindings are preserved byte-for-byte; this patch installs or executes none of them."

replace = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
replace_instance_guides = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md", "instance/validations/README.md", "instance/components/README.md"]
migrate = ["instance/manifest.toml", "instance/startup-capsule.toml", "instance/components/registry.toml", "instance/maps/domain-map.toml", "instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml", "instance/profile/**", "instance/governance/**", "instance/evolution/index.toml", "instance/validations/index.toml"]
preserve = ["workspace/**", "instance/components/**", "instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", "instance/validations/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[classification]
precedence = ["migration_rules", "replace_instance_guides", "migrate", "preserve", "replace", "remove"]
overlap_policy = "first-matching-classification-wins-after-applicable-migration-rules; every selected path must resolve to exactly one effective action"
guide_overlap_note = "Only the exact README files in replace_instance_guides are target-template guides. Sibling user files, Skill requirements, export indexes and packages, component bodies, validation records and migrated profiles remain instance-owned."
validation_overlap_note = "instance/validations/index.toml is migrated before the broad instance/validations/** preserve rule. A template stays the target template empty index; an instance keeps its identity and every real validation record, and no record may be invented by this patch."
evolution_overlap_note = "instance/evolution/index.toml is migrated before the broad instance/evolution/** preserve rule. A template stays blank; an instance keeps candidate sources and its existing generated_at unless the indexed business projection actually changes."
component_overlap_note = "instance/components/registry.toml is migrated before the broad instance/components/** preserve rule. A template keeps the inert template registry; an instance keeps its identity, adoption state, revision, entries and component bodies."
skill_overlap_note = "instance/skills/** is instance-owned and preserved. The blank target has only its empty requirements map and no exports index; an existing instance keeps requirements, installed Skill routes, export index, generated packages and unknown package fields byte-for-byte. The upgrade never creates, converts, reviews, installs, shares or removes a Skill."

[target_selection]
mode = "fixed-release-content-or-trusted-commit-allowlist"
forbid_unlisted_files = true
forbidden_segments = [".git", "node_modules", ".cache", ".vite", ".turbo", "coverage", "tmp", "temp", "maintainer-private", ".assistant-private", ".assistant-local"]
allow_overrides_deny_for_exact_paths = [".assistant-local/.gitkeep", ".assistant-local/dashboard/.gitkeep", ".assistant-local/indexes/.gitkeep", ".assistant-local/skills/.gitkeep", ".assistant-local/task-handoffs/.gitkeep", ".assistant-local/upgrade-inbox/.gitkeep", ".assistant-private/.gitkeep", ".assistant-private/assets/.gitkeep", ".assistant-private/inbox/.gitkeep"]
exact_override_policy = "only-listed-regular-zero-byte-files-may-override-forbidden-segments; directory-records-are-container-metadata-not-files"
broad_globs_are_copy_commands = false

[instance_component_changes]
schema = "1.0"
registry = "instance/components/registry.toml"
target_interfaces = ["agent-carry.instance-component@1"]
migration_ids = ["instance-component-adoption-1.4", "instance-component-interface-1.0"]
native_asset_policy = "reuse-existing-formal-owners-never-create-duplicate-component-manifests"
professional_extension_policy = "reuse-extension-toml-never-duplicate-in-generic-registry"
unregistered_policy = "preserve-and-stop-with-preview"
optional_incompatible_action = "disable-and-preserve"
required_incompatible_action = "stop-and-preserve"
device_local_policy = "preserve-in-place-on-same-device-never-copy-to-public-or-complete-migration-reverify-before-use"
ordinary_startup = "never-read-registry-enumerate-components-or-load-component-bodies"
authorization = "reuse-the-current-durable-action-authorization-never-add-a-compatibility-only-user-confirmation"

[[migration_rules]]
id = "skill-workshop-1.4.4"
from_versions = ["1.4.3"]
when_all = ["source reports product 1.4.3", "the official fixed v1.4.4 tag Release object manifest and extracted tree agree and the user authorized that exact upgrade", "upgrade runs in a new isolated candidate against a verified 1.4.3 template or instance"]
source = "the complete 1.4.3 tree plus its strictly parsed manifest identity-bound indexes component registry startup capsule snapshots preserved instance-owned Skills exports assets workspace local bindings private state and the running-session baseline recorded before a future switch"
destination = "an isolated 1.4.4 template or instance candidate with unchanged user-owned content a strict rebuilt capsule byte-identical snapshots and an explicit pending or accepted host-session activation state"
operation_order = ["freeze the complete source-tree identity rollback point and current running-session product baseline before any candidate write", "strictly distinguish an uninstantiated template from an instantiated assistant before selecting the branch", "for a template use the fixed 1.4.4 blank template identity files together and keep instance_id=template state=template zero records zero candidates zero components no approved profile no Skill export index and no generated package", "for an instance preserve instance_id created_from direction profile learning policy maps signals governance hosts Skill requirements installed Skill routes export index generated Skill packages assets validation records candidate sources extensions components local bindings private references workspace and unknown fields", "update only the instantiated manifest product version from 1.4.3 to 1.4.4", "do not rerun first instantiation open the Skill Workshop convert an asset create an export index inspect or install a shared Skill refresh an unchanged candidate timestamp or invent an asset validation candidate todo component approval session fact", "rebuild the strict startup capsule from exact merged manifest bytes", "rebuild dashboard/public/snapshot.js and dashboard/dist/snapshot.js from merged formal truth and require byte identity", "compare every preserved path byte-for-byte and require a zero-change second file pass before any future switch", "after a future switch keep source verification file installation instance switching session activation and target behavior acceptance separate", "if the running-session baseline predates 1.4.4 keep the valid instance installed and require a fresh task in the same instance unless the host proves a real instruction-chain rebootstrap", "accept completion only after one representative 1.4.4 Skill Workshop behavior is observed in the activated session without changing a real asset or installing a package"]
forbidden = ["upgrading from an unfixed branch archive or a tag without the matching official Release object", "re-running first instantiation against an existing instance", "changing instance identity created_from direction profile learning policy or user-owned fields", "inventing or promoting an asset validation candidate task result component approval Skill export session baseline activation fact or behavior result", "resetting an instance index registry Skill map export package signal host governance card extension workspace local binding or private reference to template state", "opening or running the Skill Workshop as an upgrade side effect", "executing package scripts installing dependencies logging into accounts uploading publishing sharing or silently rewriting a Skill during upgrade or inspection", "treating a version string hash capsule snapshot static text or manual file reread as proof of host-session activation", "rolling back a valid installed instance only because the running session is stale or one representative behavior failed", "weakening startup capsule snapshot candidate component result-validation privacy secret or Skill package checks", "modifying the source tree or a real installed instance during rehearsal"]
unknown_or_ambiguous = "preserve the complete 1.4.3 source candidate and failure scene; report the exact file identity ownership Skill package session or behavior fact that is missing; isolate only the unsafe switch package or completion claim and keep unrelated capabilities usable"
idempotence = "same-source-second-file-run-makes-no-file-record-export-timestamp-or-snapshot-byte-change; no Skill conversion inspection installation sharing or session acceptance is inferred without new user and host evidence"

[verification]
checks = ["manifest-parses", "version-1.4.4-and-existing-schema-versions-aligned", "only-1.4.3-is-a-direct-source-and-older-versions-chain-through-published-manifests", "published-1.4.3-manifest-remains-byte-immutable", "published-1.4.4-authority-requires-fixed-tag-release-object-matching-tree-and-user-authorization", "skill-workshop-recommendations-are-advisory-and-non-persistent", "only-the-user-selected-formal-method-enters-an-isolated-local-draft", "source-asset-remains-byte-unchanged-during-export", "generated-skill-summary-excludes-source-identity-and-private-paths", "shared-skill-inspection-is-read-only-and-never-executes-scripts-or-installs-dependencies", "ready-review-and-isolated-results-are-contained-to-the-current-package", "generated-skill-detail-actions-only-copy-bounded-requests-and-reload-the-real-local-index", "upload-share-publish-login-and-installation-require-separate-user-intent-and-authorization", "blank-1.4.4-template-has-zero-export-index-zero-generated-packages-and-zero-installed-skills", "one-canonical-blank-template-completes-general-and-video-editing-first-instantiation", "first-instantiation-business-and-learning-assets-remain-zero-while-governance-is-three", "uninstantiated-1.4.3-template-upgrades-to-byte-exact-blank-1.4.4", "instantiated-1.4.3-identity-assets-validation-evolution-components-extensions-workspace-local-private-skill-requirements-and-exports-are-byte-preserved", "source-files-switch-session-and-behavior-states-remain-distinct", "startup-capsule-is-rebuilt-after-version-migration-and-its-source-digest-closes", "merged-instance-truth-rebuilds-public-and-dist-snapshots-byte-identically", "patch-upgrade-faults-restore-complete-source-and-second-file-run-makes-no-change", "public-distribution-excludes-private-maintainer-assets-real-skills-exports-components-bindings-user-data-and-local-acceptance-evidence", "complete-tree-platform-identity-and-preserved-path-bytes-close-before-switch"]
risk_policy = "reuse the blank-startup and two-scenario first-instantiation lifelines plus the focused Skill Workshop contract and one synthetic existing-instance Skill preservation check; do not add a browser matrix host matrix package ecosystem or full-product regression"

[release_boundary]
status = "published-release"
release_ref = "v1.4.4"
publication_authorized = true
repository_operation_authorized = true
instance_replacement_authorized = true
