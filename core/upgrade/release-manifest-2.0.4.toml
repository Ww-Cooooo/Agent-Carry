schema_version = 2
release = "2.0.4"
core = "2.0.4"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.3"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
private_asset_catalog_schema = "1.0"
migration_kit_schema = "2.0"
extension_manifest_schema = "1.0"
instance_component_schema = "1.0"
result_validation_evidence_schema = "1.0"
startup_capsule_schema = "1.0"
from_versions = ["1.4.8", "1.4.9", "2.0.0", "2.0.1", "2.0.2", "2.0.3"]
required_preview_executor = "dashboard/scripts/ai-carry-upgrade-cli.mjs"
required_preview_command = "prepare --source <current-instance-root> --target <verified-extracted-target-root>"
required_preview_policy = "on an explicit update check verify the latest formal GitHub Release fixed lightweight tag public main exact tree target bytes and release manifest; prepare is read-only and displays its returned userPreview"
required_confirm_policy = "after the exact preview wait for the user's next independent upgrade or confirm-upgrade reply; confirm rechecks the same local source target instance release boundary and write set without repeating network access and rejects real drift"
required_session_reentry_policy = "after the file switch refresh a pending snapshot then run only the returned sessionReentryCommand and one relevant non-destructive behavior; never run the dashboard development check suite in an installed instance; copied-instance local runtimes still require the current component's bounded explicit-binding check"
notes = "AI Carry 2.0.4 removes a fragile startup-budget self-check that treated prose and schema examples as machine configuration. assistant.toml is the single structured budget source while actual startup bytes signal projection agreement and strict capsule closure remain checked. Installed-instance acceptance uses the returned session reentry plus one relevant non-destructive behavior rather than maintainer development checks. AI Carry 2.0.3 compatibility fault containment privacy and ownership boundaries remain unchanged."
asset_changes = "Asset Schema remains 1.3. Memories capabilities SOPs experiences candidates validations and Skills keep their existing owners and bytes. The upgrade creates promotes resets or rewrites no user-owned asset; future and unknown fields remain preserved."
dashboard_changes = "Dashboard Snapshot Schema remains 1.1 and Dashboard Action Schema remains 1.0. Product version advances to 2.0.4. The existing update action and returned session reentry remain the only user upgrade route; no new button registry service or background process is added."
extension_changes = "Extension API Extension Manifest Schema and Instance Component Schema remain 1.0. Existing components professional workspaces device bindings and private references remain instance-owned. Optional incompatibility limits that item; required incompatibility or a user-data privacy or ownership ambiguity pauses only the formal switch."

replace = ["README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "START-HERE.txt", "START-HERE.en.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitattributes", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard.en.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
replace_instance_guides = ["instance/profile/README.md", "instance/memory/README.md", "instance/capabilities/README.md", "instance/sops/README.md", "instance/experiences/README.md", "instance/evolution/README.md", "instance/todo/README.md", "instance/deferred/README.md", "instance/governance/README.md", "instance/signals/README.md", "instance/hosts/README.md", "instance/validations/README.md", "instance/components/README.md"]
migrate = ["instance/manifest.toml", "instance/startup-capsule.toml"]
preserve = ["workspace/**", "instance/components/**", "instance/maps/**", "instance/profile/**", "instance/governance/**", "instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", "instance/validations/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[classification]
precedence = ["migration_rules", "replace_instance_guides", "migrate", "preserve", "replace", "remove"]
overlap_policy = "first-matching-classification-wins-after-applicable-migration-rules; every selected path must resolve to exactly one effective action"
guide_overlap_note = "Only the exact README files in replace_instance_guides are target-template guides; every sibling user file remains instance-owned."
validation_overlap_note = "A clean template uses the target empty validation index; an existing instance keeps its index and records byte-for-byte."
evolution_overlap_note = "A clean template uses the target empty candidate index; an existing instance keeps its index candidates and timestamps byte-for-byte."
component_overlap_note = "A clean template uses the target registry; an existing instance keeps current or legacy component registry bodies bindings and unknown fields."
skill_overlap_note = "instance/skills/** is instance-owned; upgrade does not infer versions execute package code or install a package."

[target_selection]
mode = "fixed-release-content-or-trusted-commit-allowlist"
forbid_unlisted_files = true
forbidden_segments = [".git", "node_modules", ".cache", ".vite", ".turbo", "coverage", "tmp", "temp", "maintainer-private", ".assistant-private", ".assistant-local"]
allow_overrides_deny_for_exact_paths = [".assistant-local/.gitkeep", ".assistant-local/dashboard/.gitkeep", ".assistant-local/indexes/.gitkeep", ".assistant-local/skills/.gitkeep", ".assistant-local/task-handoffs/.gitkeep", ".assistant-local/upgrade-inbox/.gitkeep", ".assistant-private/.gitkeep", ".assistant-private/assets/.gitkeep", ".assistant-private/inbox/.gitkeep"]
exact_override_policy = "only listed regular zero-byte placeholder files may override forbidden segments"
broad_globs_are_copy_commands = false

[instance_component_changes]
schema = "1.0"
registry = "instance/components/registry.toml"
target_interfaces = ["ai-carry.instance-component@1", "agent-carry.instance-component@1"]
migration_ids = ["startup-budget-instance-acceptance-2.0.4"]
native_asset_policy = "reuse existing formal owners; do not duplicate memory capability SOP experience Skill or workspace bodies as components"
professional_extension_policy = "reuse extension.toml and do not duplicate professional workspaces in the generic registry"
unregistered_policy = "preserve and classify only when the related durable change or upgrade needs it"
optional_incompatible_action = "disable-and-preserve"
required_incompatible_action = "stop-switch-and-preserve"
device_local_policy = "preserve on the same device and keep out of public or portable truth; inspect only the current tool's explicit bindings before copied-instance execution"
ordinary_startup = "never enumerate components workspaces bindings or local tools"
authorization = "reuse the current durable action authorization; add no compatibility-only confirmation"

[[migration_rules]]
id = "startup-budget-instance-acceptance-2.0.4"
from_versions = ["1.4.8", "1.4.9", "2.0.0", "2.0.1", "2.0.2", "2.0.3"]
when_all = ["source reports one recognized direct version and AI Carry or known legacy identity", "official v2.0.4 Release lightweight tag public main manifest and extracted tree agree", "the user authorizes this exact upgrade after the bound preview"]
source = "bounded product preimages plus only the instance paths required to preserve identity and rebuild the startup capsule and snapshots"
destination = "the same stable instance root on AI Carry 2.0.4 with instance-owned local private future and unknown bytes preserved"
operation_order = ["live-verify the fixed official v2.0.4 Release tag public main tree target bytes and manifest once during prepare", "bind the preview to source target instance release boundary and product write set", "after exact user confirmation recheck those local facts without a second network request", "copy the verified public target to an isolated candidate and reject unlisted private local linked or conflicting target paths", "preserve instance identity created_from profile maps signals governance assets validations candidates Skills components extensions workspaces bindings private references reports handoffs future fields and unknown paths", "adapt reconnect rebuild or locally limit only content actually affected by the new mother template; do not create compatibility metadata merely to satisfy this agreement", "update only the instance product version and rebuild the strict startup capsule from the merged manifest", "switch changed product files transactionally and restore touched preimages once on a core failure", "refresh the byte-identical snapshot pair after the safe core result; a snapshot-only fault leaves a clear local retry instead of undoing the core", "run the returned session reentry and one relevant non-destructive behavior without installing dependencies or running maintainer check suites", "report the actual changes automatic repairs preserved content limited items current usability and next step"]
forbidden = ["treating field spelling order timestamp folder shape or an inferable omission as a whole-assistant fatal error", "using a fixed exhaustive table instead of reasoning from the real instance", "overwriting deleting or silently reclassifying user data private content unknown fields or unknown paths", "turning an optional component Skill index local tool or snapshot fault into a whole-assistant failure", "adding a second central asset registry background scanner state machine or compatibility-only confirmation", "executing package scripts installing dependencies or launching instance tools during the upgrade file transaction", "reusing a preview after source target instance release boundary or write-set drift", "accepting caller-authored authority target self-report an unfixed branch archive or a tag without the matching official Release", "modifying a real installed instance during rehearsal", "uploading sending committing publishing renaming a repository or deleting retained evidence without separate authority"]
unknown_or_ambiguous = "preserve unknown bytes and fields; if ownership privacy overwrite risk or a required capability remains genuinely ambiguous after bounded repair pause only the affected write or formal switch and explain one smallest next decision"
idempotence = "a second run against the same installed 2.0.4 source verifies current product startup and snapshot closure and makes no user file asset binding timestamp report or snapshot change"

[verification]
upgrade_preservation = "one representative complex 2.0.3 instance keeps identity user assets Skills components workspaces local private future and unknown bytes while product files advance"
local_fault_containment = "one optional incompatible or repairable derivative fault limits only that item and leaves conversation core and unrelated abilities usable"
staging_recovery = "a failure before switch leaves the source untouched and a core-switch failure restores every touched product preimage once"
second_run = "the same completed source produces no changes"
public_boundary = "the public projection contains the agreement and release materials but no maintainer state real instance local binding cache Skill carrier report private content or secret"
checks = ["version-and-current-release-pointers-aligned", "direct-sources-include-2.0.3-without-rewriting-history", "blank-template-remains-empty", "representative-2.0.3-instance-upgrade-preserves-instance-owned-and-unknown-bytes", "startup-budget-uses-structured-assistant-source-and-rejects-real-signal-drift", "installed-instance-acceptance-excludes-maintainer-check-suites", "compatibility-agreement-loads-for-durable-change-and-template-upgrade", "optional-fault-is-local-and-hard-user-data-privacy-ownership-boundaries-remain", "startup-capsule-and-snapshot-pair-close-on-2.0.4", "second-run-is-zero-change", "chinese-and-english-readme-current-facts-match", "public-projection-excludes-private-maintainer-and-instance-material"]
risk_policy = "use one focused release check one representative old-instance upgrade and one clean public build; do not add a host or model matrix background service whole-machine scan database or enterprise regression suite"

[release_boundary]
status = "published-release"
release_ref = "v2.0.4"
publication_authorized = true
repository_operation_authorized = true
instance_replacement_authorized = true
future_publication_or_repository_operation_authorized = false
authority_requires = ["official-latest-release-is-v2.0.4", "official-release-object-v2.0.4", "official-lightweight-tag-v2.0.4", "official-public-main-equals-v2.0.4-tag", "manifest-and-extracted-tree-match-the-fixed-tag", "user-explicitly-authorized-this-upgrade"]
authority_scope = "this fixed release may replace an instance only after every external condition above exists; this local candidate alone authorizes no instance replacement or future repository action"
maintainer_private_paths = ["AGENTS.override.md", ".assistant-private/**", ".assistant-local/**", "maintainer-private/**", "workspace/**"]
