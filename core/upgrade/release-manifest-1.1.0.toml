schema_version = 1
release = "1.1.0"
core = "1.1.0"
license = "Apache-2.0"
extension_api = "1.0"
asset_schema = "1.2"
dashboard_snapshot_schema = "1.1"
dashboard_action_schema = "1.0"
cross_session_signal_schema = "1.1"
host_integration_schema = "1.0"
migration_kit_schema = "1.0"
from_versions = ["1.0.0"]
notes = "Backward-compatible update from Agent Carry 1.0.0. Adds public contribution, issue and security-reporting entry points; registers one official public update source that is read only after an explicit user request and never enables background, automatic or forced updates; and aligns the archive handoff plus minimal routing maps so onboarding choices, task state, asset formation and optional model orchestration reach their existing protocols without broad startup loading. Product and core versions advance to 1.1.0 while extension, asset, dashboard, signal, host-integration and migration-kit schemas remain unchanged. Upgrade replaces template-owned project, community, routing, documentation and dashboard files; migrates instance identity and governance schedule state; and preserves user memory, capabilities, SOPs, experiences, evolution, todos, deferred work, skills, signals, host profiles, local private content and rebuildable local derivatives."
extension_changes = "Compatible with extension API 1.0; no extension migration is required."
dashboard_changes = "Keeps Dashboard Snapshot Schema 1.1 and Action Schema 1.0; the official-update action now follows the registered public source and explicit-request-only policy."

replace = ["README.md", "INSTALL.md", "START-HERE.txt", "AGENTS.md", "BOOTSTRAP.md", "CONTRIBUTING.md", "SECURITY.md", ".github/**", "assistant.toml", ".gitignore", "LICENSE", "core/**", "docs/**", "dashboard.html", "dashboard/**", "_data/**", "THIRD_PARTY_NOTICES.md"]
migrate = ["instance/manifest.toml", "instance/maps/domain-map.toml", "instance/maps/signal-map.toml", "instance/maps/time-trigger-map.toml", "instance/profile/**", "instance/governance/**"]
preserve = ["instance/memory/**", "instance/capabilities/**", "instance/sops/**", "instance/experiences/**", "instance/evolution/**", "instance/todo/**", "instance/deferred/**", "instance/skills/**", "instance/signals/**", "instance/hosts/**", ".assistant-private/**", ".assistant-local/**"]
remove = []

[verification]
checks = ["manifest-parses", "version-1.1.0-aligned", "upgrade-from-1.0.0-supported", "project-license-apache-2.0-valid", "third-party-provenance-and-licenses-valid", "official-update-source-identity-valid", "official-update-explicit-request-only", "community-entrypoints-valid", "security-reporting-entry-valid", "archive-handoff-valid", "routing-trigger-coverage-valid", "direction-lock-preserved", "guidance-mode-and-direction-independent", "instance-assets-preserved", "governance-card-body-current-and-instance-schedule-preserved", "host-profiles-preserved", "privacy-boundary-valid", "git-safe-and-private-export-actions-aligned", "secret-exclusion-valid", "schemas-aligned", "dashboard-actions-aligned", "dashboard-offline-responsive-valid", "snapshot-rebuilt"]
risk_policy = "targeted-not-enterprise-regression"
